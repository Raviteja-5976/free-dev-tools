name: Sync free-for-dev list

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync
      - name: Commit if the list changed
        run: |
          if git diff --quiet -- content; then
            echo "No upstream changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "chore: sync free-for-dev @ $(cut -c1-7 content/UPSTREAM_COMMIT)"
          git push
